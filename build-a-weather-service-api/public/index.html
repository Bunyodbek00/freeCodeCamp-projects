<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky — Weather Lookup</title>
    <style>
      :root {
        --ink: #0f1b2b;
        --paper: #f3f6f9;
        --accent: #ff8a3d;
        --card: rgba(255, 255, 255, 0.14);
        --card-border: rgba(255, 255, 255, 0.28);
        --transition: 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        color: var(--paper);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
        background: linear-gradient(160deg, #2a4159 0%, #16232f 55%, #0c141d 100%);
        transition: background var(--transition);
        overflow-x: hidden;
      }
      body[data-condition="clear"] { background: linear-gradient(160deg, #4a90c9 0%, #2f6aa3 45%, #1b3f63 100%); }
      body[data-condition="clouds"] { background: linear-gradient(160deg, #6b7a8a 0%, #4a5a6b 45%, #2c3a47 100%); }
      body[data-condition="rain"] { background: linear-gradient(160deg, #38495c 0%, #263341 45%, #141c26 100%); }
      body[data-condition="wind"] { background: linear-gradient(160deg, #5c8a82 0%, #3c6660 45%, #223e3a 100%); }
      body[data-condition="snow"] { background: linear-gradient(160deg, #a9bcd0 0%, #7e93ab 45%, #4e5f74 100%); }
      body[data-condition="error"] { background: linear-gradient(160deg, #5a3232 0%, #3a2020 55%, #1d1010 100%); }
      .shell { width: 100%; max-width: 640px; }
      header { margin-bottom: 1.75rem; text-align: left; }
      .kicker {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.6);
        margin: 0 0 0.35rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.1rem, 5vw, 2.9rem);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .lookup {
        background: var(--card);
        border: 1px solid var(--card-border);
        backdrop-filter: blur(18px);
        border-radius: 22px;
        padding: 1.6rem;
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
      }
      form { display: flex; gap: 0.6rem; }
      input[type="text"] {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.18);
        color: var(--paper);
        border-radius: 12px;
        padding: 0.85rem 1rem;
        font-size: 1.02rem;
        font-family: inherit;
      }
      input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.45); }
      input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.go {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        border: none;
        border-radius: 12px;
        padding: 0 1.4rem;
        background: var(--accent);
        color: #1a0e00;
        font-weight: 600;
        font-size: 0.96rem;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      button.go:hover, button.go:focus-visible {
        background: #ffa563;
        transform: translateY(-1px);
        outline: none;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
      .chip {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.85rem;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.06);
        color: var(--paper);
        padding: 0.4rem 0.85rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .chip:hover, .chip:focus-visible {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.5);
        outline: none;
      }
      .result {
        margin-top: 1.75rem;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 500ms ease, transform 500ms ease;
        pointer-events: none;
      }
      .result.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
      .result-top { display: flex; align-items: center; gap: 1.25rem; }
      .icon-wrap { width: 84px; height: 84px; flex-shrink: 0; }
      .icon-wrap svg { width: 100%; height: 100%; }
      .temp-block .city {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.72);
        margin: 0 0 0.15rem;
      }
      .temp-block .temp {
        font-size: clamp(2.6rem, 7vw, 3.6rem);
        line-height: 1;
        font-weight: 500;
        margin: 0;
      }
      .temp-block .desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.8);
        margin: 0.3rem 0 0;
        text-transform: capitalize;
      }
      .error-box {
        margin-top: 1.75rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.95rem;
        color: #ffd7d7;
        background: rgba(120, 30, 30, 0.35);
        border: 1px solid rgba(255, 130, 130, 0.35);
        border-radius: 12px;
        padding: 0.9rem 1.1rem;
        display: none;
      }
      .error-box.visible { display: block; }
      footer {
        margin-top: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.45);
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        body, .result { transition: none; }
      }
    </style>
  </head>
  <body data-condition="default">
    <div class="shell">
      <header>
        <p class="kicker">WEATHER</p>
        <h1>What's the weather like?</h1>
      </header>

      <div class="lookup">
        <form id="weatherForm">
          <input type="text" id="cityInput" placeholder="Search a city" value="London" autocomplete="off" />
          <button class="go" type="submit">Check</button>
        </form>

        <div class="chips" id="cityChips">
          <button type="button" class="chip" data-city="London">London</button>
          <button type="button" class="chip" data-city="Tokyo">Tokyo</button>
          <button type="button" class="chip" data-city="New York">New York</button>
          <button type="button" class="chip" data-city="Chicago">Chicago</button>
          <button type="button" class="chip" data-city="Los Angeles">Los Angeles</button>
        </div>

        <div class="result" id="result">
          <div class="result-top">
            <div class="icon-wrap" id="iconWrap"></div>
            <div class="temp-block">
              <p class="city" id="cityName">—</p>
              <p class="temp" id="temp">—</p>
              <p class="desc" id="description">—</p>
            </div>
          </div>
        </div>

        <div class="error-box" id="errorBox"></div>
      </div>

      <footer>Data from the freeCodeCamp weather proxy</footer>
    </div>

    <script>
      const ICONS = {
        clear: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="22" fill="#ffc857"/>
          <g stroke="#ffc857" stroke-width="5" stroke-linecap="round">
            <line x1="50" y1="8" x2="50" y2="20"/>
            <line x1="50" y1="80" x2="50" y2="92"/>
            <line x1="8" y1="50" x2="20" y2="50"/>
            <line x1="80" y1="50" x2="92" y2="50"/>
            <line x1="20.5" y1="20.5" x2="28.8" y2="28.8"/>
            <line x1="71.2" y1="71.2" x2="79.5" y2="79.5"/>
            <line x1="79.5" y1="20.5" x2="71.2" y2="28.8"/>
            <line x1="28.8" y1="71.2" x2="20.5" y2="79.5"/>
          </g>
        </svg>`,
        clouds: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 66c-9 0-16-7-16-16 0-8.5 6.8-15.4 15.2-16 2.8-9.4 11.6-16 21.8-16 12.3 0 22.3 9.6 23 21.8 8 1.3 14 8.2 14 16.5 0 9.4-7.6 17-17 17H28z" fill="#cfd8e3"/>
        </svg>`,
        rain: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M26 52c-9 0-16-7-16-16 0-8.5 6.8-15.4 15.2-16 2.8-9.4 11.6-16 21.8-16 12.3 0 22.3 9.6 23 21.8 8 1.3 14 8.2 14 16.5 0 9.4-7.6 17-17 17H26z" fill="#9db3c7"/>
          <g stroke="#6fa8dc" stroke-width="4.5" stroke-linecap="round">
            <line x1="32" y1="70" x2="27" y2="84"/>
            <line x1="50" y1="70" x2="45" y2="84"/>
            <line x1="68" y1="70" x2="63" y2="84"/>
          </g>
        </svg>`,
        wind: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#bfeee0" stroke-width="5.5" stroke-linecap="round">
            <path d="M12 38h50a10 10 0 1 0-9-14.5"/>
            <path d="M12 58h62a10 10 0 1 1-9 14.5"/>
            <path d="M12 78h38"/>
          </g>
        </svg>`,
        snow: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 54c-9 0-16-7-16-16 0-8.5 6.8-15.4 15.2-16 2.8-9.4 11.6-16 21.8-16 12.3 0 22.3 9.6 23 21.8 8 1.3 14 8.2 14 16.5 0 9.4-7.6 17-17 17H28z" fill="#d7e4ef"/>
          <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
            <line x1="33" y1="70" x2="33" y2="84"/>
            <line x1="27" y1="77" x2="39" y2="77"/>
            <line x1="66" y1="70" x2="66" y2="84"/>
            <line x1="60" y1="77" x2="72" y2="77"/>
          </g>
        </svg>`,
      };

      function iconFor(description) {
        const d = description.toLowerCase();
        if (d.includes("rain") || d.includes("drizzle") || d.includes("storm")) return ICONS.rain;
        if (d.includes("snow")) return ICONS.snow;
        if (d.includes("wind") || d.includes("breez")) return ICONS.wind;
        if (d.includes("cloud") || d.includes("overcast") || d.includes("fog") || d.includes("mist")) return ICONS.clouds;
        return ICONS.clear;
      }

      function conditionKeyFor(description) {
        const d = description.toLowerCase();
        if (d.includes("rain") || d.includes("drizzle") || d.includes("storm")) return "rain";
        if (d.includes("snow")) return "snow";
        if (d.includes("wind") || d.includes("breez")) return "wind";
        if (d.includes("cloud") || d.includes("overcast") || d.includes("fog") || d.includes("mist")) return "clouds";
        return "clear";
      }

      const form = document.getElementById("weatherForm");
      const cityInput = document.getElementById("cityInput");
      const chips = document.getElementById("cityChips");
      const result = document.getElementById("result");
      const errorBox = document.getElementById("errorBox");
      const iconWrap = document.getElementById("iconWrap");
      const cityNameEl = document.getElementById("cityName");
      const tempEl = document.getElementById("temp");
      const descEl = document.getElementById("description");

      async function fetchWeather(city) {
        result.classList.remove("visible");
        errorBox.classList.remove("visible");

        try {
          const response = await fetch(`/api/weather/${encodeURIComponent(city)}`);
          const data = await response.json();

          if (!response.ok) {
            document.body.dataset.condition = "error";
            errorBox.textContent = data.error || "Couldn't find that city.";
            errorBox.classList.add("visible");
            return;
          }

          const conditionKey = conditionKeyFor(data.description);
          document.body.dataset.condition = conditionKey;

          cityNameEl.textContent = data.city;
          tempEl.textContent = `${Math.round(data.temperature)}°C`;
          descEl.textContent = data.description;
          iconWrap.innerHTML = iconFor(data.description);

          requestAnimationFrame(() => result.classList.add("visible"));
        } catch (err) {
          console.error(err);
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const city = cityInput.value.trim();
        if (city) fetchWeather(city);
      });

      chips.addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        cityInput.value = btn.dataset.city;
        fetchWeather(btn.dataset.city);
      });

      fetchWeather(cityInput.value);
    </script>
  </body>
</html>
